name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: unefy
          POSTGRES_PASSWORD: unefy
          POSTGRES_DB: unefy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unefy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # The whole application package passes strict now (2026-08-10), so the
      # bar moved from a hand-kept list of clean modules to all of `app/`.
      # `tests/` and the scripts still carry the old debt and stay out until
      # it is paid — checking them would only re-freeze the list problem.
      - name: Type-check
        run: uv run mypy --strict app/

      # One process, deliberately: the suite shares one database, and parallel
      # runs produce phantom failures.
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://unefy:unefy@localhost:5432/unefy_test
          # Settings refuse placeholder secrets outside DEBUG — CI is a dev
          # environment in that sense, and the tests mint their own sessions.
          DEBUG: "true"
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 24, to match the npm generation the lockfile is maintained with:
          # npm 10 (node 22) insists on installing @swc/core's *optional* peer
          # @swc/helpers and fails npm ci because the lockfile - correctly,
          # under npm 11 - does not pin it.
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # google-services.json is deliberately absent here — the conditional
      # plugin application must keep the build green without it, and CI is
      # exactly the fork-shaped environment that proves it.
      # `test` as well as `testDebugUnitTest`: core:model is a pure Kotlin
      # module and has no Android variants, so the variant-specific task does
      # not exist there. Without it the scoring engine, the hit detector and
      # the target locator — the parts with real logic in them — were never
      # run by CI at all.
      - name: Unit tests, lint, build
        run: ./gradlew test testDebugUnitTest lintDebug assembleDebug
