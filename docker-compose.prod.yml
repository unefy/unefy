services:
  web:
    image: ghcr.io/unefy/unefy-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      API_URL: http://backend:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      NEXT_PUBLIC_API_URL: ${BACKEND_URL}
      NEXT_PUBLIC_APP_URL: ${WEB_APP_URL}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ghcr.io/unefy/unefy-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment: &backend-env
      DATABASE_URL: postgresql+asyncpg://unefy:${POSTGRES_PASSWORD}@postgres:5432/unefy
      REDIS_URL: redis://redis:6379/0
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self-hosted}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      ATTENDANCE_SECRET: ${ATTENDANCE_SECRET}
      BACKEND_URL: ${BACKEND_URL}
      WEB_APP_URL: ${WEB_APP_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_MOBILE_CLIENT_IDS: ${GOOGLE_MOBILE_CLIENT_IDS:-[]}
      # Without SMTP_HOST the backend logs messages instead of sending them —
      # which in production means every login code sits in the log in clear
      # text and reaches nobody. Unset stays unset here so that failure mode
      # is still reachable on purpose, not by forgetting to pass it through.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-unefy <noreply@localhost>}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrate:
    image: ghcr.io/unefy/unefy-backend:${IMAGE_TAG:-latest}
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: unefy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: unefy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unefy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
